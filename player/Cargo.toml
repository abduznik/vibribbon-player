[package]
name = "vibribbon-player"
description = "Play Vib-Ribbon with any song"
version = "0.1.0"   # keep equal to the workspace version (the packaging tools do not follow inheritance)
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
authors = ["The Vib-Ribbon Player contributors"]

[lib]
name = "vibribbon_player"
path = "src/lib.rs"

[[bin]]
name = "vibribbon-player"
path = "src/main.rs"

[dependencies]
vibrt = { path = "../crates/vibrt" }
media = { path = "../crates/media" }
macros = { path = "../crates/macros" }
audioout = { path = "../crates/audioout" }
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
gilrs = { version = "0.11", optional = true }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = "1"
png = "0.17"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = []
# Gamepad support through gilrs; needs libudev headers on Linux (CI release builds enable it).
gamepad = ["dep:gilrs"]

[package.metadata.deb]
name = "vibribbon-player"
copyright = "2026 The Vib-Ribbon Player contributors"
maintainer = "The Vib-Ribbon Player contributors <noreply@users.noreply.github.com>"
section = "games"
priority = "optional"
depends = "$auto, libudev1"
extended-description = "Play Vib-Ribbon with any song. Needs your own copy of the game."
assets = [
    ["target/release/vibribbon-player", "usr/bin/", "755"],
    ["../packaging/linux/vibribbon-player.desktop", "usr/share/applications/", "644"],
    ["assets/logo-512.png", "usr/share/icons/hicolor/512x512/apps/vibribbon-player.png", "644"],
    ["../README.md", "usr/share/doc/vibribbon-player/", "644"],
    ["../LICENSE-MIT", "usr/share/doc/vibribbon-player/", "644"],
    ["../LICENSE-APACHE", "usr/share/doc/vibribbon-player/", "644"],
]

[package.metadata.generate-rpm]
name = "vibribbon-player"
assets = [
    { source = "target/release/vibribbon-player", dest = "/usr/bin/vibribbon-player", mode = "755" },
    { source = "../packaging/linux/vibribbon-player.desktop", dest = "/usr/share/applications/vibribbon-player.desktop", mode = "644" },
    { source = "assets/logo-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/vibribbon-player.png", mode = "644" },
    { source = "../LICENSE-MIT", dest = "/usr/share/doc/vibribbon-player/LICENSE-MIT", mode = "644", doc = true },
    { source = "../LICENSE-APACHE", dest = "/usr/share/doc/vibribbon-player/LICENSE-APACHE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
systemd-libs = "*"
