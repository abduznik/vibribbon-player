[workspace]
resolver = "2"
members = ["crates/vibrt", "crates/media", "crates/macros", "crates/audioout", "player"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
debug = false

[profile.dev]
opt-level = 1      # the emulation core is useless unoptimised
