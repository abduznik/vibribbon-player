[package]
name = "media"
description = "Disc image readers (CUE/BIN, CHD) and song decoding for the vibrecomp player"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vibrt = { path = "../vibrt" }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm", "alac", "adpcm", "mkv"] }
rubato = "0.16"
chd = "0.3"
